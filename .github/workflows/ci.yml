name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:check
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      # Dependencies are read from pyproject.toml; the project itself is not an installable package.
      - run: |
          python - <<'PY' > requirements.txt
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(project["dependencies"] + project["optional-dependencies"]["dev"]))
          PY
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m mypy pipeline tests
